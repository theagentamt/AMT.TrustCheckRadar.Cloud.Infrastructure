name: Sync Dev deploy access

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev-access
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EXPECTED_ACCOUNT_ID: "107827791950"
      PROJECT_NAME: trustcheckradar
      DEPLOY_ENV: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
          role-session-name: deploy-access-${{ github.run_id }}

      - name: Validate exact Dev target
        run: |
          set -euo pipefail
          expected_role="arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/${PROJECT_NAME}-${DEPLOY_ENV}-github-deploy"
          [[ "$AWS_ROLE_ARN" == "$expected_role" ]]
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$EXPECTED_ACCOUNT_ID" ]]

      - name: Build exact bounded policies
        run: |
          set -euo pipefail
          policy_arn="arn:aws:iam::${EXPECTED_ACCOUNT_ID}:policy/${PROJECT_NAME}-${DEPLOY_ENV}-github-deploy"
          default_version="$(aws iam get-policy --policy-arn "$policy_arn" --query 'Policy.DefaultVersionId' --output text)"
          aws iam get-policy-version --policy-arn "$policy_arn" --version-id "$default_version" \
            --query 'PolicyVersion.Document' --output json > "$RUNNER_TEMP/current-policy.json"
          python3 scripts/build_dev_deploy_access.py \
            --current-managed-policy "$RUNNER_TEMP/current-policy.json" \
            --managed-policy-output "$RUNNER_TEMP/managed-policy.json" \
            --account-policy-output "$RUNNER_TEMP/account-policy.json" \
            --account-id "$EXPECTED_ACCOUNT_ID" --region "$AWS_REGION"

      - name: Sync managed and inline policy documents
        run: |
          set -euo pipefail
          policy_arn="arn:aws:iam::${EXPECTED_ACCOUNT_ID}:policy/${PROJECT_NAME}-${DEPLOY_ENV}-github-deploy"
          role_name="${PROJECT_NAME}-${DEPLOY_ENV}-github-deploy"
          # The backticks belong to the AWS CLI JMESPath boolean literal.
          # shellcheck disable=SC2016
          mapfile -t old_versions < <(aws iam list-policy-versions --policy-arn "$policy_arn" \
            --query 'sort_by(Versions[?IsDefaultVersion==`false`],&CreateDate)[].VersionId' --output text | tr '\t' '\n')
          if (( ${#old_versions[@]} >= 4 )); then
            aws iam delete-policy-version --policy-arn "$policy_arn" --version-id "${old_versions[0]}"
          fi
          aws iam create-policy-version --policy-arn "$policy_arn" \
            --policy-document "file://$RUNNER_TEMP/managed-policy.json" --set-as-default >/dev/null
          aws iam put-role-policy --role-name "$role_name" \
            --policy-name manage-account-deletion-reconciliation \
            --policy-document "file://$RUNNER_TEMP/account-policy.json"

      - name: Verify required reads
        run: |
          set -euo pipefail
          alarm_arn="arn:aws:cloudwatch:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:alarm:${PROJECT_NAME}-${DEPLOY_ENV}-account-data-api-errors"
          rule_name="${PROJECT_NAME}-${DEPLOY_ENV}-account-deletion-reconcile"
          verified=false
          for _ in {1..12}; do
            if aws cloudwatch list-tags-for-resource --resource-arn "$alarm_arn" >/dev/null 2>&1 && \
               aws events describe-rule --name "$rule_name" >/dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]
          echo "Dev deploy-role observability and account-reconciliation reads verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated policy files
        if: always()
        run: rm -f "$RUNNER_TEMP/current-policy.json" "$RUNNER_TEMP/managed-policy.json" "$RUNNER_TEMP/account-policy.json"
