name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "environments/**"
      # Resolver has its own reviewed release workflow. Workflow-only changes
      # require an explicit dispatch rather than applying every legacy stack.
      - "!terraform/url-resolver/**"
      - "!terraform/url-assessment/**"
      - "!terraform/url-consumer/**"
      - "!terraform/message-consumer/**"
      - "!terraform/recovery-consumer/**"
      - "!terraform/result-feedback/**"
      - "!environments/*/url-resolver.tfvars"
      - "!environments/*/url-assessment.tfvars"
      - "!environments/*/url-consumer.tfvars"
      - "!environments/*/message-consumer.tfvars"
      - "!environments/*/recovery-consumer.tfvars"
      - "!environments/*/result-feedback.tfvars"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      artifact_release:
        description: Immutable Lambda artifact release identifier
        required: false
        type: string
      deployment_scope:
        description: Select the complete environment or an isolated stack
        required: true
        default: all
        type: choice
        options:
          - all
          - foundation
          - campaign-data
          - history-data
          - history-processing
          - research-plan-campaign-processing
          - research-plan-api
          - research-migrate-campaign-processing
          - research-migrate-api
      execution_mode:
        description: Generate plans only or apply them
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      expected_revision:
        description: Full release commit SHA required for the Dev research plan
        required: false
        type: string
      reviewed_plan_digest:
        description: Exact reviewed research migration plan digest required for apply
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && !startsWith(inputs.deployment_scope, 'research-')
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      DEPLOY_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_scope || 'all' }}
      EXECUTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_mode || 'apply' }}
      STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX || 'trustcheckradar' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_key_prefix: ${{ vars.TF_STATE_KEY_PREFIX || 'trustcheckradar' }}
      TF_VAR_artifact_release: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_release || vars.ARTIFACT_RELEASE }}
      TF_VAR_budget_notification_emails: ${{ vars.CAMPAIGN_BUDGET_NOTIFICATION_EMAILS || '[]' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.12.1
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-${{ github.run_id }}

      - name: Configure optional campaign inputs
        env:
          CAMPAIGN_REVIEWER_USERNAME: ${{ secrets.CAMPAIGN_REVIEWER_USERNAME }}
        run: |
          if [[ -n "$CAMPAIGN_REVIEWER_USERNAME" ]]; then
            echo "TF_VAR_campaign_reviewer_username=$CAMPAIGN_REVIEWER_USERNAME" >> "$GITHUB_ENV"
          fi

      - name: Check deployment configuration
        run: |
          test -n "$TF_VAR_state_bucket_name" || { echo "TF_STATE_BUCKET is not configured for $DEPLOY_ENV"; exit 1; }
          test -n "$TF_VAR_state_bucket_region" || { echo "AWS_REGION is not configured for $DEPLOY_ENV"; exit 1; }
          if [[ "$DEPLOY_SCOPE" == "all" ]]; then
            test -n "$TF_VAR_artifact_release" || { echo "ARTIFACT_RELEASE or workflow artifact_release is required"; exit 1; }
          fi

      - name: Plan foundation
        run: |
          terraform -chdir=terraform/foundation init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/foundation.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/foundation plan \
            -var-file="../../environments/$DEPLOY_ENV/foundation.tfvars" \
            -out=foundation.tfplan

      - name: Apply foundation
        if: env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/foundation apply -auto-approve foundation.tfplan

      - name: Plan History data
        if: env.DEPLOY_SCOPE == 'all' || env.DEPLOY_SCOPE == 'history-data'
        run: |
          terraform -chdir=terraform/history-data init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/history-data.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/history-data plan \
            -var-file="../../environments/$DEPLOY_ENV/history-data.tfvars" \
            -out=history-data.tfplan

      - name: Apply History data
        if: (env.DEPLOY_SCOPE == 'all' || env.DEPLOY_SCOPE == 'history-data') && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/history-data apply -auto-approve history-data.tfplan

      - name: Plan History processing
        if: env.DEPLOY_SCOPE == 'all' || env.DEPLOY_SCOPE == 'history-processing'
        run: |
          terraform -chdir=terraform/history-processing init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/history-processing.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/history-processing plan \
            -var-file="../../environments/$DEPLOY_ENV/history-processing.tfvars" \
            -out=history-processing.tfplan

      - name: Apply History processing
        if: (env.DEPLOY_SCOPE == 'all' || env.DEPLOY_SCOPE == 'history-processing') && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/history-processing apply -auto-approve history-processing.tfplan

      - name: Plan campaign data
        if: env.DEPLOY_SCOPE == 'all' || env.DEPLOY_SCOPE == 'campaign-data'
        run: |
          terraform -chdir=terraform/campaign-data init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/campaign-data.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/campaign-data plan \
            -var-file="../../environments/$DEPLOY_ENV/campaign-data.tfvars" \
            -out=campaign-data.tfplan

      - name: Apply campaign data
        if: (env.DEPLOY_SCOPE == 'all' || env.DEPLOY_SCOPE == 'campaign-data') && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/campaign-data apply -auto-approve campaign-data.tfplan

      - name: Verify immutable Lambda artifacts
        if: env.DEPLOY_SCOPE == 'all' && (env.EXECUTION_MODE == 'apply' || github.event_name == 'workflow_dispatch')
        run: |
          artifact_bucket=$(terraform -chdir=terraform/foundation output -raw artifact_bucket_name)
          for artifact in \
            age_attestation.zip \
            conversation_analysis.zip \
            device_registration.zip \
            device_recovery.zip \
            purchase_handoff.zip \
            entitlement_snapshot.zip \
            campaign_participation.zip \
            post_confirmation.zip \
            web_risk_communication.zip
          do
            aws s3api head-object \
              --bucket "$artifact_bucket" \
              --key "releases/$TF_VAR_artifact_release/$artifact" >/dev/null
          done

      - name: Verify immutable campaign artifacts
        if: env.DEPLOY_SCOPE == 'all' && env.EXECUTION_MODE == 'apply'
        run: |
          processing_vars="environments/$DEPLOY_ENV/campaign-processing.tfvars"
          api_vars="environments/$DEPLOY_ENV/campaign-api.tfvars"
          if grep -Eq '^campaign_processing_enabled[[:space:]]*=[[:space:]]*true' "$processing_vars"; then
            test -n "$TF_VAR_artifact_release" || { echo "Campaign processing requires ARTIFACT_RELEASE"; exit 1; }
            artifact_bucket=$(terraform -chdir=terraform/foundation output -raw artifact_bucket_name)
            for artifact in \
              campaign_observation_publisher.zip \
              campaign_cluster_aggregator.zip \
              campaign_lifecycle.zip \
              campaign_deletion_bridge.zip
            do
              aws s3api head-object \
                --bucket "$artifact_bucket" \
                --key "releases/$TF_VAR_artifact_release/$artifact" >/dev/null
            done
          fi
          if grep -Eq '^campaign_api_enabled[[:space:]]*=[[:space:]]*true' "$api_vars"; then
            test -n "$TF_VAR_artifact_release" || { echo "Campaign API requires ARTIFACT_RELEASE"; exit 1; }
            artifact_bucket=$(terraform -chdir=terraform/foundation output -raw artifact_bucket_name)
            aws s3api head-object \
              --bucket "$artifact_bucket" \
              --key "releases/$TF_VAR_artifact_release/campaign_trends.zip" >/dev/null
          fi
          if grep -Eq '^campaign_review_api_enabled[[:space:]]*=[[:space:]]*true' "$api_vars"; then
            test -n "$TF_VAR_campaign_reviewer_username" || { echo "Campaign review requires CAMPAIGN_REVIEWER_USERNAME"; exit 1; }
            artifact_bucket=$(terraform -chdir=terraform/foundation output -raw artifact_bucket_name)
            aws s3api head-object \
              --bucket "$artifact_bucket" \
              --key "releases/$TF_VAR_artifact_release/campaign_review.zip" >/dev/null
          fi

      - name: Plan campaign processing
        if: env.DEPLOY_SCOPE == 'all'
        run: |
          terraform -chdir=terraform/campaign-processing init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/campaign-processing.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/campaign-processing plan \
            -var-file="../../environments/$DEPLOY_ENV/campaign-processing.tfvars" \
            -out=campaign-processing.tfplan

      - name: Apply campaign processing
        if: env.DEPLOY_SCOPE == 'all' && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/campaign-processing apply -auto-approve campaign-processing.tfplan

      # Upgrade the outbox consumer before analysis can emit new locator records.
      - name: Plan API
        if: env.DEPLOY_SCOPE == 'all'
        run: |
          terraform -chdir=terraform/api init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/api.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/api plan \
            -var-file="../../environments/$DEPLOY_ENV/api.tfvars" \
            -out=api.tfplan

      - name: Apply API
        if: env.DEPLOY_SCOPE == 'all' && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/api apply -auto-approve api.tfplan

      - name: Plan campaign API
        if: env.DEPLOY_SCOPE == 'all'
        run: |
          terraform -chdir=terraform/campaign-api init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/campaign-api.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/campaign-api plan \
            -var-file="../../environments/$DEPLOY_ENV/campaign-api.tfvars" \
            -out=campaign-api.tfplan

      - name: Apply campaign API
        if: env.DEPLOY_SCOPE == 'all' && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/campaign-api apply -auto-approve campaign-api.tfplan

      - name: Plan edge
        if: env.DEPLOY_SCOPE == 'all'
        run: |
          terraform -chdir=terraform/edge init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/edge.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/edge plan \
            -var-file="../../environments/$DEPLOY_ENV/edge.tfvars" \
            -out=edge.tfplan

      - name: Apply edge
        if: env.DEPLOY_SCOPE == 'all' && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/edge apply -auto-approve edge.tfplan

      - name: Plan identity workflows
        if: env.DEPLOY_SCOPE == 'all'
        run: |
          terraform -chdir=terraform/identity-workflows init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=$STATE_KEY_PREFIX/$DEPLOY_ENV/identity-workflows.tfstate" \
            -backend-config="region=$TF_VAR_state_bucket_region" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/identity-workflows plan \
            -var-file="../../environments/$DEPLOY_ENV/identity-workflows.tfvars" \
            -out=identity-workflows.tfplan

      - name: Apply identity workflows
        if: env.DEPLOY_SCOPE == 'all' && env.EXECUTION_MODE == 'apply'
        run: terraform -chdir=terraform/identity-workflows apply -auto-approve identity-workflows.tfplan

      - name: Deployment summary
        run: |
          {
            echo "### $DEPLOY_ENV infrastructure"
            echo "Scope: \`$DEPLOY_SCOPE\`"
            echo "Mode: \`$EXECUTION_MODE\`"
            if [[ "$DEPLOY_SCOPE" == "campaign-data" && "$EXECUTION_MODE" == "apply" ]]; then
              echo "Campaign data enabled: \`$(terraform -chdir=terraform/campaign-data output -raw campaign_intelligence_enabled)\`"
            fi
            if [[ "$DEPLOY_SCOPE" == "all" ]]; then
              echo "Release: \`$TF_VAR_artifact_release\`"
              if [[ "$EXECUTION_MODE" == "apply" ]]; then
                echo "API endpoint: \`$(terraform -chdir=terraform/edge output -raw base_url)\`"
                echo "Campaign data enabled: \`$(terraform -chdir=terraform/campaign-data output -raw campaign_intelligence_enabled)\`"
                echo "Campaign processing enabled: \`$(terraform -chdir=terraform/campaign-processing output -raw campaign_processing_enabled)\`"
                echo "Campaign API enabled: \`$(terraform -chdir=terraform/campaign-api output -raw campaign_api_enabled)\`"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  research-plan:
    name: Dev research migration
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.deployment_scope, 'research-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
      EXECUTION_MODE: ${{ inputs.execution_mode }}
      REQUESTED_SCOPE: ${{ inputs.deployment_scope }}
      REVIEWED_PLAN_DIGEST: ${{ inputs.reviewed_plan_digest }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_state_bucket_name: amt-trustcheckradar-107827791950-tfstate
      TF_VAR_state_bucket_region: us-east-1
      TF_VAR_state_key_prefix: trustcheckradar
      TF_VAR_artifact_release: ${{ inputs.artifact_release || vars.ARTIFACT_RELEASE }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate bounded release plan request
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/release-V01
          test "$REQUESTED_ENVIRONMENT" = dev
          if [[ "$REQUESTED_SCOPE" == research-plan-* ]]; then
            test "$EXECUTION_MODE" = plan
          else
            [[ "$EXECUTION_MODE" == plan || "$EXECUTION_MODE" == apply ]]
            if [[ "$EXECUTION_MODE" == apply ]]; then
              [[ "$REVIEWED_PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            fi
          fi
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_REVISION" = "$GITHUB_SHA"
          test "$EXPECTED_REVISION" = "$(git rev-parse HEAD)"
          case "$REQUESTED_SCOPE" in
            research-plan-campaign-processing|research-migrate-campaign-processing) echo 'STACK=campaign-processing' >> "$GITHUB_ENV" ;;
            research-plan-api|research-migrate-api) echo 'STACK=api' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
          test -n "$TF_VAR_artifact_release"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.12.1
          terraform_wrapper: false
      - name: Authenticate to Dev
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::107827791950:role/trustcheckradar-dev-github-deploy
          aws-region: us-east-1
          allowed-account-ids: '107827791950'
          role-session-name: research-plan-${{ github.run_id }}
      - name: Plan only the selected stack
        shell: bash
        run: |
          terraform -chdir="terraform/$STACK" init -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=trustcheckradar/dev/$STACK.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" > "$RUNNER_TEMP/research-init.log" 2>&1
          args=(-var-file="../../environments/dev/$STACK.tfvars")
          candidate="environments/dev/research-migration-$STACK.tfvars.json"
          if [[ -f "$candidate" ]]; then
            args+=(-var-file="../../$candidate")
          fi
          # Raw Terraform output and state-derived plans stay on the runner.
          terraform -chdir="terraform/$STACK" plan "${args[@]}" \
            -out="$RUNNER_TEMP/research.tfplan" > "$RUNNER_TEMP/research-plan.log" 2>&1
          terraform -chdir="terraform/$STACK" show -json "$RUNNER_TEMP/research.tfplan" > "$RUNNER_TEMP/research-plan.json"
          if [[ "$REQUESTED_SCOPE" == research-migrate-* ]]; then
            verify_args=(--revision "$EXPECTED_REVISION" --stack "$STACK")
            if [[ "$EXECUTION_MODE" == apply ]]; then
              verify_args+=(--apply --expected-digest "$REVIEWED_PLAN_DIGEST")
            fi
            python3 scripts/verify_research_release.py "$RUNNER_TEMP/research-plan.json" "${verify_args[@]}" > "$RUNNER_TEMP/research-review.json"
          else
            python3 scripts/summarize_research_plan.py "$RUNNER_TEMP/research-plan.json" \
              --revision "$EXPECTED_REVISION" --stack "$STACK" > "$RUNNER_TEMP/research-review.json"
          fi
          cat "$RUNNER_TEMP/research-review.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply only the verified saved plan
        if: startsWith(inputs.deployment_scope, 'research-migrate-') && inputs.execution_mode == 'apply'
        shell: bash
        run: |
          terraform -chdir="terraform/$STACK" apply -input=false "$RUNNER_TEMP/research.tfplan" > "$RUNNER_TEMP/research-apply.log" 2>&1
          echo "Applied the reviewed saved Dev $STACK plan." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify no drift after apply
        if: startsWith(inputs.deployment_scope, 'research-migrate-') && inputs.execution_mode == 'apply'
        shell: bash
        run: |
          terraform -chdir="terraform/$STACK" plan \
            -var-file="../../environments/dev/$STACK.tfvars" -detailed-exitcode > "$RUNNER_TEMP/research-drift.log" 2>&1
          echo "Post-apply plan: no drift." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish minimized plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/research-review.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove private plans and logs
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/research-init.log "$RUNNER_TEMP"/research-plan.log "$RUNNER_TEMP"/research.tfplan "$RUNNER_TEMP"/research-plan.json "$RUNNER_TEMP"/research-apply.log "$RUNNER_TEMP"/research-drift.log
