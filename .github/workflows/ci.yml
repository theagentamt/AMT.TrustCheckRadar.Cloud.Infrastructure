name: Terraform CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.12.1
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate state bootstrap
        working-directory: bootstrap/state-bucket
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate access bootstrap
        working-directory: bootstrap/access
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate foundation
        working-directory: terraform/foundation
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate campaign data
        working-directory: terraform/campaign-data
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate API
        working-directory: terraform/api
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate History data
        working-directory: terraform/history-data
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate History processing
        working-directory: terraform/history-processing
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate campaign processing
        working-directory: terraform/campaign-processing
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate campaign API
        working-directory: terraform/campaign-api
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate edge
        working-directory: terraform/edge
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate URL resolver
        working-directory: terraform/url-resolver
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate private URL assessment
        working-directory: terraform/url-assessment
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate V1 URL consumer candidate
        working-directory: terraform/url-consumer
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate V1 message consumer candidate
        working-directory: terraform/message-consumer
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate V1 recovery consumer candidate
        working-directory: terraform/recovery-consumer
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate V1 result feedback candidate
        working-directory: terraform/result-feedback
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate inactive Google Play verifier
        working-directory: terraform/play-verification
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate disposable URL resolver fixture
        working-directory: terraform/url-resolver/acceptance-fixture
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate identity workflows
        working-directory: terraform/identity-workflows
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate helper scripts
        run: |
          bash -n scripts/terraform.sh
          bash -n scripts/check_campaign_guardrails.sh
          bash -n terraform/api/scripts/smoke_test_analysis.sh
          bash -n terraform/campaign-api/scripts/smoke_test_campaign_trends.sh
          python3 -m py_compile terraform/identity-workflows/scripts/update_user_pool_lambda_config.py

      - name: Check campaign infrastructure guardrails
        run: scripts/check_campaign_guardrails.sh

      - name: Test Terraform helper routing without AWS
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
